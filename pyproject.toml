[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
# Use a repo-local tmp base so `tmp_path` doesn't depend on the OS temp dir
# (and to avoid permission issues with locked system temp directories).
addopts = "--basetemp=.pytest_tmp"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", ".git", "__pycache__", "data", "logs", "graphify-out"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"run_bot.py" = ["E402"]
