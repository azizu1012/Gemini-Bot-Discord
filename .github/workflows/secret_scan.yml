name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: secret-scan-${{ github.ref }}
      cancel-in-progress: true
    env:
      DIFF_RANGE: ${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.sha) || github.event_name == 'push' && format('{0}...{1}', github.event.before, github.sha) || format('{0}^..{0}', github.sha) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Scan current diff for new credentials
        run: |
          python scripts/scan_secrets.py --git-diff "$DIFF_RANGE" --json > new_findings.json
          python - <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path("new_findings.json").read_text() or "[]")
          if data:
              for f in data:
                  print(f"[{f['severity'].upper():8}] {f['path']}:{f['line']}  {f['rule']}\n           {f['preview']}")
              raise SystemExit("New credential finding(s) block this change.")
          print("No new credentials found in the change.")
          PY

      - name: Scan tracked files for historical findings
        run: |
          python scripts/scan_secrets.py --git --json > findings.json || true
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("findings.json").read_text() or "[]")
          if not data:
              print("No secrets found.")
          else:
              for f in data:
                  print(f"[{f['severity'].upper():8}] {f['path']}:{f['line']}  {f['rule']}")
                  print(f"           {f['preview']}")
              print(f"\n{len(data)} finding(s)")
          PY

      - name: Summary
        run: |
          {
            echo "### Secret scan"
            echo ""
            echo '```'
            cat findings.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show human-readable report
        run: python scripts/scan_secrets.py --git --warn-only
