# Build + scan + push bot image lên GHCR.
# - PR: build + Trivy scan, không push.
# - main/tags: push ghcr.io/<owner>/<repo> (latest / sha / semver).
# Deploy trên server: BOT_IMAGE=<image>:<tag> docker compose pull && docker compose up -d
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Compose file
        run: AZURIS_DB_PASSWORD=dummy-validate-only docker compose config --quiet

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Docker reference bắt buộc lowercase nhưng github.repository giữ nguyên
      # chữ hoa (Gemini-Bot-Discord) — metadata tự lowercase tag, còn ref digest
      # ghép tay ở bước Trivy phải lowercase thủ công.
      - name: Lowercase repo for digest ref
        if: github.event_name != 'pull_request'
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build (PR — local only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: azuris-bot:pr-scan
          # Không dùng GHA cache: từng ghi nhận cache phục vụ layer pip cũ
          # (image chứa msgpack/urllib3/setuptools cũ dù requirements đã mới).
          # Build tươi ~3-5 phút, đổi lấy tính đúng đắn tuyệt đối.
          no-cache: true

      - name: Build and push
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Xem chú thích no-cache ở bước PR: tính đúng đắn > tốc độ.
          no-cache: true

      - name: Trivy scan (fail on fixable CRITICAL/HIGH)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: azuris-bot:pr-scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # pip ship SBOM của deps vendored (chỉ dùng lúc build, bot không
          # chạy pip ở runtime): bỏ qua file này, vẫn quét dist-info thật.
          skip-files: usr/local/lib/python3.12/site-packages/pip/_vendor/bom.cdx.json
          exit-code: '1'

      - name: Trivy scan pushed image (fail on fixable CRITICAL/HIGH)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.REPO_LC }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Xem chú thích skip-files ở bước PR.
          skip-files: usr/local/lib/python3.12/site-packages/pip/_vendor/bom.cdx.json
          exit-code: '1'
