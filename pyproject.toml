[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
# Use a repo-local tmp base so `tmp_path` doesn't depend on the OS temp dir
# (and to avoid permission issues with locked system temp directories).
addopts = "--basetemp=.pytest_tmp"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", ".git", "__pycache__", "data", "logs", "graphify-out"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"run_bot.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
# Discord, redis, exa, bs4, etc. ship missing/incomplete stubs.
ignore_missing_imports = true
# mypy confuses core.config <-> src.core.config unless we pin package layout.
explicit_package_bases = true
namespace_packages = true

# DB mixins call self._ensure_pool()/self.pool which is provided by the
# composing DatabaseRepository. mypy can't see the composed class, so we
# skip strict checking there (they are 100% covered by offline tests).
[[tool.mypy.overrides]]
module = "src.database.mixins.*"
ignore_errors = true
check_untyped_defs = false

# Third-party stubs (discord UI framework, redis, exa, bs4) are incomplete;
# checking them yields false positives. We still check the surrounding logic.
[[tool.mypy.overrides]]
module = [
  "src.handlers.discord.ui",
  "src.voice.ui",
  "src.voice.lock_service",
  "src.voice.purge",
  "src.voice.tools_service",
  "src.tools.search.providers.exa",
  "src.tools.search.providers.duckduckgo",
  "src.services.messaging.redis_client",
  "src.core.llm.genai_client",
  "src.core.llm.endpoint_url",
  "src.tools.search.mixins.text",
  "src.tools.search.mixins.ranking",
  "src.tools.search.mixins.evidence",
  "src.services.indexing.parser",
]
ignore_errors = true
check_untyped_defs = false
